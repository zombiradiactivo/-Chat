# Configuración de CustomTkinter
customtkinter.Theme: dark
customtkinter.ColorTheme: blue

# Configuración de logging
logging.Level: INFO
logging.Format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
logging.DateFormat: '%Y-%m-%d %H:%M:%S'
logging.LogToFile: true
logging.LogToConsole: true

# Configuración de la aplicación
app.WindowWidth: 1200
app.WindowHeight: 700
app.MinWindowWidth: 900
app.MinWindowHeight: 500

# Configuración de red
network.DefaultHost: 127.0.0.1
network.DefaultPort: 5555
network.BufferSize: 4096
network.MaxConnections: 100

# Configuración de archivos
files.MaxFileSize: 104857600  # 100 MB en bytes
files.ChunkSize: 8192

# Configuración de video
video.FPS: 15
video.Quality: 70
